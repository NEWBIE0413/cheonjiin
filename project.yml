name: Cheonjiin
options:
  deploymentTarget:
    iOS: "17.0"
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "3"
    TARGETED_DEVICE_FAMILY: "1"
packages:
  CheonjiinCore:
    path: Core
targets:
  Cheonjiin:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - target: CheonjiinKeyboard
      - package: CheonjiinCore
    entitlements:
      path: App/Cheonjiin.entitlements
      properties:
        com.apple.security.application-groups: [group.$(BUNDLE_ID_PREFIX).cheonjiin]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: 천지in
        CFBundleDevelopmentRegion: ko
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        CheonjiinAppGroup: group.$(BUNDLE_ID_PREFIX).cheonjiin
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).cheonjiin
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
  CheonjiinKeyboard:
    type: app-extension
    platform: iOS
    sources: [Keyboard]
    dependencies:
      - package: CheonjiinCore
    entitlements:
      path: Keyboard/CheonjiinKeyboard.entitlements
      properties:
        com.apple.security.application-groups: [group.$(BUNDLE_ID_PREFIX).cheonjiin]
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: 천지in
        CFBundleDevelopmentRegion: ko
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # 앱에서 고른 설정을 읽는 공유 저장소.
        CheonjiinAppGroup: group.$(BUNDLE_ID_PREFIX).cheonjiin
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: ko-KR
            # 진동과 키 소리는 '전체 접근 허용'을 켜야만 난다. 네트워크는 쓰지 않는다.
            RequestsOpenAccess: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).cheonjiin.keyboard
        TARGETED_DEVICE_FAMILY: "1"
